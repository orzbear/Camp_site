spring:
  application:
    name: outscout-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:outscout}
    username: ${POSTGRES_USER:outscout}
    password: ${POSTGRES_PASSWORD:outscout}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false   # ← Redis not installed yet; keep health check quiet

logging:
  level:
    com.outscout: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Custom application properties
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  weather:
    api-base: ${OPEN_METEO_BASE:https://api.open-meteo.com/v1/forecast}
    cache-ttl: 7200 # 2 hours in seconds
  redis:
    enabled: ${REDIS_ENABLED:false}

